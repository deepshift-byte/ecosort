name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write  # publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # latest commit, incl. a freshly trained model

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoSort-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk EcoSort.apk
          notes="EcoSort Android app, built from ${GITHUB_SHA::7}. Download EcoSort.apk on your phone and open it to install (allow installs from unknown sources when asked)."
          gh release create "$tag" EcoSort.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "EcoSort ${tag}" --notes "$notes" --latest
